<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Your Trip — Voyager Elite Travel Agency</title>
  <meta name="description" content="Tell us your dream itinerary and we'll craft a custom trip.">
  <meta property="og:title" content="Plan Your Trip — Voyager Elite Travel Agency">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="travel-plan-content">
    <section class="page-hero" style="height:280px">
      <img src="images/hero-mountains.jpg" alt="Plan your trip">
      <div class="overlay"><h1>Plan Your Trip</h1><p>No package? No problem. Tell us where you want to go and we'll build it.</p></div>
    </section>
    <section class="section">
      <div class="container" style="max-width:48rem">
        <div class="card" style="padding:1.5rem">
          <form id="travel-plan-form" class="space-y-6">
            <div class="form-row">
              <div class="form-group"><label>Full Name *</label><input name="name" required></div>
              <div class="form-group"><label>Email *</label><input name="email" type="email" required></div>
              <div class="form-group"><label>Phone</label><input name="phone" type="tel"></div>
              <div class="form-group"><label>Travelers</label><input name="num_travelers" type="number" min="1" value="2"></div>
            </div>
            <div class="form-group"><label>Departing From *</label><input name="from_location" required placeholder="City or airport"></div>
            <div id="destinations-list-input">
              <div class="form-group"><label>Destination 1 *</label><input name="destination" required placeholder="City or region"></div>
            </div>
            <button type="button" class="btn btn-outline text-sm" id="add-destination">+ Add Destination</button>
            <div class="form-row">
              <div class="form-group"><label>Start Date</label><input name="start_date" type="date"></div>
              <div class="form-group"><label>End Date</label><input name="end_date" type="date"></div>
            </div>
            <div class="form-group"><label>Trip Type</label>
              <select name="trip_type"><option value="domestic">Domestic (India)</option><option value="international">International</option></select>
            </div>
            <div class="form-group"><label>Preferred Transport</label>
              <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="transport" value="air" checked> ✈️ Flight</label>
                <label class="checkbox-label"><input type="checkbox" name="transport" value="rail"> 🚂 Train</label>
                <label class="checkbox-label"><input type="checkbox" name="transport" value="bus"> 🚌 Bus</label>
                <label class="checkbox-label"><input type="checkbox" name="transport" value="car"> 🚗 Car / Taxi</label>
              </div>
            </div>
            <div class="form-group"><label>Budget per Person (₹)</label><input name="budget" type="number" placeholder="Optional"></div>
            <div class="form-group"><label>Additional Notes</label><textarea name="notes" rows="3" placeholder="Special requests, dietary needs, etc."></textarea></div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Submit Trip Request</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="travel-plan-success" class="hidden">
    <div class="container section">
      <div class="card success-card" style="max-width:36rem;margin:0 auto">
        <div style="font-size:3rem;color:var(--primary)">✓</div>
        <h1 class="mt-4" style="font-size:1.5rem">Trip request received!</h1>
        <p class="text-muted mt-2">Our travel desk will craft a custom itinerary and reach out within 24 hours.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem">
          <a href="index.html" class="btn btn-outline">Back to Home</a>
          <a href="packages.html" class="btn btn-primary">Browse Packages</a>
        </div>
      </div>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/app.js"></script>
  <script>
    VE.initLayout("travel-plan");
    VE_APP.initTravelPlanForm();
  </script>

  <div id="toast"></div>
</body>
</html>
